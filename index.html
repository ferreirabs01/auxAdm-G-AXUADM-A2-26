<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositório - Auxiliar Administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .rotate-180 {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-6 md:p-10">
    
    <div class="max-w-6xl mx-auto">
        
        <header class="mb-12 text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-3 tracking-tight">Auxiliar Administrativo</h1>
            <p class="text-slate-500 font-medium">Repositório de Aulas, Apresentações e Dinâmicas</p>
            
            <!-- Botão do Sorteador -->
            <button onclick="abrirSorteador()" class="mt-6 px-6 py-2 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition-colors shadow-md flex items-center justify-center gap-2 mx-auto">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                Sorteador de Grupos
            </button>
        </header>

        <!-- Grid de Aulas -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="aulas-grid">
            <!-- Os cards serão injetados aqui via JavaScript -->
        </div>

    </div>

    <!-- Modal do Sorteador -->
    <div id="modal-sorteador" class="hidden fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex justify-center items-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    Sorteador e Presença
                </h2>
                <button onclick="fecharSorteador()" class="text-slate-400 hover:text-red-500 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-5 overflow-y-auto flex-1 flex flex-col md:flex-row gap-6">
                <!-- Lista de Alunos -->
                <div class="flex-1 border-r border-slate-100 pr-0 md:pr-6 flex flex-col">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-semibold text-slate-700">Lista de Alunos</h3>
                        <div class="text-xs space-x-2">
                            <button onclick="marcarTodos(true)" class="text-indigo-600 font-semibold hover:underline">Marcar Todos</button>
                            <span class="text-slate-300">|</span>
                            <button onclick="marcarTodos(false)" class="text-slate-500 hover:underline">Limpar</button>
                        </div>
                    </div>
                    <div class="text-xs text-slate-500 mb-2">Selecione apenas os presentes na aula. Salvo automaticamente.</div>
                    <div id="lista-alunos" class="space-y-2 flex-1 max-h-60 md:max-h-96 overflow-y-auto bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <!-- Checkboxes gerados pelo JS -->
                    </div>
                </div>

                <!-- Controles e Resultado -->
                <div class="flex-1 flex flex-col">
                    <div class="mb-5 bg-indigo-50 p-4 rounded-lg border border-indigo-100">
                        <label class="block text-sm font-semibold text-indigo-900 mb-2">Quantidade de Integrantes por Grupo:</label>
                        <div class="flex gap-2">
                            <input type="number" id="tamanho-grupo" min="1" value="2" class="w-24 px-3 py-2 border border-indigo-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-semibold text-center text-lg text-indigo-700">
                            <button onclick="realizarSorteio()" class="flex-1 bg-indigo-600 text-white rounded-lg font-bold text-lg hover:bg-indigo-700 transition-colors shadow-sm">GERAR GRUPOS</button>
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-semibold text-slate-700">Resultado do Sorteio:</h3>
                            <span id="contador-resultado" class="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded">0 Grupos</span>
                        </div>
                        <div id="resultado-sorteio" class="flex-1 bg-white rounded-lg p-4 border border-slate-200 overflow-y-auto max-h-60 md:max-h-[300px] text-sm text-slate-800 space-y-3 shadow-inner">
                            <div class="h-full flex flex-col items-center justify-center text-slate-400">
                                <svg class="w-12 h-12 mb-2 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                <p>Aguardando sorteio...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CÓDIGO EXISTENTE (GRID DE AULAS)
        // ==========================================
        const grid = document.getElementById('aulas-grid');
        const totalAulas = 20;

        for (let i = 1; i <= totalAulas; i++) {
            const numeroAula = i < 10 ? '0' + i : i;
            let conteudo = '<p class="text-sm text-slate-400 italic py-2">Conteúdo a ser definido.</p>';

            // Configuração específica para a Aula 01
            if (i === 1) {
                conteudo = `
                    <div class="flex flex-col gap-3">
                        <p class="text-sm text-slate-600 font-medium mb-1">Materiais da Aula:</p>
                        
                        <!-- 1. Link para Apresentação Inicial -->
                        <a href="./Apresentacao/Apresentacao.html" target="_blank" class="group flex items-center justify-between p-3 rounded-lg bg-blue-50 border border-blue-100 text-blue-700 hover:bg-blue-600 hover:text-white hover:border-blue-600 transition-all duration-200">
                            <div class="flex items-center gap-3">
                                <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                                <span class="text-sm font-semibold">Apresentação Inicial</span>
                            </div>
                            <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>

                        <!-- 2. Link para Apresentação do Curso -->
                        <a href="./Apresentacao/apresentacao_curso.html" target="_blank" class="group flex items-center justify-between p-3 rounded-lg bg-indigo-50 border border-indigo-100 text-indigo-700 hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition-all duration-200">
                            <div class="flex items-center gap-3">
                                <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                <span class="text-sm font-semibold">Apresentação do Curso</span>
                            </div>
                            <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>

                        <!-- 3. Link para Dinâmica Marcas -->
                        <a href="./AULA-01/dinamica_marcas.html" target="_blank" class="group flex items-center justify-between p-3 rounded-lg bg-emerald-50 border border-emerald-100 text-emerald-700 hover:bg-emerald-600 hover:text-white hover:border-emerald-600 transition-all duration-200">
                            <div class="flex items-center gap-3">
                                <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <span class="text-sm font-semibold">Dinâmica: Marcas</span>
                            </div>
                            <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>

                        <!-- 4. Link para Dinâmica Pitch -->
                        <a href="./AULA-01/dinamica_pitch.html" target="_blank" class="group flex items-center justify-between p-3 rounded-lg bg-amber-50 border border-amber-100 text-amber-700 hover:bg-amber-600 hover:text-white hover:border-amber-600 transition-all duration-200">
                            <div class="flex items-center gap-3">
                                <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
                                <span class="text-sm font-semibold">Dinâmica: Pitch</span>
                            </div>
                            <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>
                    </div>
                `;
            }

            if (i === 2) {
                conteudo = `
                    <div class="flex flex-col gap-3">
                        <p class="text-sm text-slate-600 font-medium mb-1">Materiais da Aula:</p>
                        
                        <!-- 1. Organizações e Empresas -->
                        <a href="./AULA-02/organizacao.html" target="_blank" class="group flex items-center justify-between p-3 rounded-lg bg-blue-50 border border-blue-100 text-blue-700 hover:bg-blue-600 hover:text-white hover:border-blue-600 transition-all duration-200">
                            <div class="flex items-center gap-3">
                                <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                                <span class="text-sm font-semibold">Organização / Empresas</span>
                            </div>
                            <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>

                        <!-- 2. add conteudo -->
                        <a href="#" target="_blank" class="group flex items-center justify-between p-3 rounded-lg bg-indigo-50 border border-indigo-100 text-indigo-700 hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition-all duration-200">
                            <div class="flex items-center gap-3">
                                <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                <span class="text-sm font-semibold">add conteudo</span>
                            </div>
                            <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>

                    </div>
                `;
            }

            const card = `
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition-shadow">
                    <button onclick="toggleAcordeao(${i})" class="w-full px-6 py-4 flex justify-between items-center bg-white hover:bg-slate-50 transition-colors focus:outline-none">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold text-sm">
                                ${i}
                            </div>
                            <h2 class="text-lg font-semibold text-slate-800">AULA-${numeroAula}</h2>
                        </div>
                        <svg id="icone-${i}" class="w-5 h-5 text-slate-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    
                    <div id="conteudo-${i}" class="hidden px-6 pb-6 pt-2 border-t border-slate-100 bg-white">
                        ${conteudo}
                    </div>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', card);
        }

        function toggleAcordeao(id) {
            const conteudo = document.getElementById('conteudo-' + id);
            const icone = document.getElementById('icone-' + id);
            
            if (conteudo.classList.contains('hidden')) {
                conteudo.classList.remove('hidden');
                icone.classList.add('rotate-180');
            } else {
                conteudo.classList.add('hidden');
                icone.classList.remove('rotate-180');
            }
        }

        // ==========================================
        // CÓDIGO NOVO (SORTEADOR E PRESENÇA)
        // ==========================================
        
        // Array com os nomes anonimizados
        const alunos = [
            "ISABELLA R**** M****", "ISABELY V**** D**** S****", "JEAN P**** S****", 
            "JESSICA P**** M****", "JOSE A**** D**** S**** M****", "JOSEFA A**** M**** G****", 
            "KAUA F**** D**** O****", "KAYKE K**** F**** P****", "KELVIN G**** O**** C****", 
            "KEMYLLI K**** B**** D**** S****", "LANNA D**** R****", "LETÍCIA C**** G**** M****", 
            "LORRAYNE S**** S****", "MARIA E**** H**** R****", "MARIELLE F**** G****", 
            "MURILO I**** D**** S**** A****", "OLAVO V**** G**** A****", "PEDRO V**** D**** O**** G****", 
            "RAFAEL V**** D**** J**** S****", "RAJAN M**** C**** F**** L****", "SANDY B**** K****", 
            "SUELI D**** S**** O**** G****", "TALITA B****", "TIFANY V**** D**** S**** G****"
        ];

        const STORAGE_KEY = 'alunos_presentes_auxadm';
        let presencas = {};

        // Inicializa o Sorteador
        function initSorteador() {
            // Tenta recuperar do LocalStorage
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                presencas = JSON.parse(stored);
            } else {
                // Por padrão, todos começam presentes
                alunos.forEach(aluno => presencas[aluno] = true);
                salvarPresencas();
            }
            renderizarListaAlunos();
        }

        function salvarPresencas() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(presencas));
        }

        function renderizarListaAlunos() {
            const container = document.getElementById('lista-alunos');
            container.innerHTML = '';
            
            alunos.forEach((aluno, index) => {
                const checked = presencas[aluno] ? 'checked' : '';
                const item = `
                    <label class="flex items-center gap-3 p-2 hover:bg-white rounded cursor-pointer transition-colors border border-transparent hover:border-slate-200">
                        <input type="checkbox" id="chk_${index}" value="${aluno}" ${checked} 
                               onchange="togglePresenca('${aluno}', this.checked)"
                               class="w-4 h-4 text-indigo-600 bg-slate-100 border-slate-300 rounded focus:ring-indigo-500">
                        <span class="text-sm font-medium ${presencas[aluno] ? 'text-slate-800' : 'text-slate-400 line-through'}">${aluno}</span>
                    </label>
                `;
                container.insertAdjacentHTML('beforeend', item);
            });
        }

        function togglePresenca(aluno, isPresent) {
            presencas[aluno] = isPresent;
            salvarPresencas();
            renderizarListaAlunos(); // Atualiza estilo do texto (tachado/normal)
        }

        function marcarTodos(estado) {
            alunos.forEach(aluno => presencas[aluno] = estado);
            salvarPresencas();
            renderizarListaAlunos();
        }

        function realizarSorteio() {
            const tamanho = parseInt(document.getElementById('tamanho-grupo').value);
            const resultadoDiv = document.getElementById('resultado-sorteio');
            const contadorDiv = document.getElementById('contador-resultado');
            
            if (isNaN(tamanho) || tamanho < 1) {
                alert("Por favor, insira um tamanho válido para os grupos (mínimo 1).");
                return;
            }

            // Filtra apenas os presentes
            let ativos = alunos.filter(a => presencas[a]);
            
            if (ativos.length === 0) {
                resultadoDiv.innerHTML = '<p class="text-red-500 italic p-4 text-center">Nenhum aluno marcado como presente.</p>';
                contadorDiv.innerText = "0 Grupos";
                return;
            }

            // Embaralha o Array (Algoritmo Fisher-Yates)
            for (let i = ativos.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [ativos[i], ativos[j]] = [ativos[j], ativos[i]];
            }

            // Divide nos Grupos
            const grupos = [];
            for (let i = 0; i < ativos.length; i += tamanho) {
                grupos.push(ativos.slice(i, i + tamanho));
            }

            // Renderiza o Resultado
            contadorDiv.innerText = `${grupos.length} Grupo(s)`;
            resultadoDiv.innerHTML = grupos.map((grupo, index) => {
                return `
                    <div class="bg-slate-50 border border-slate-200 rounded-md p-3 mb-2">
                        <h4 class="font-bold text-indigo-700 text-sm mb-2 uppercase tracking-wide">Grupo ${index + 1} <span class="text-slate-400 font-normal text-xs ml-1">(${grupo.length} integrantes)</span></h4>
                        <ul class="pl-2 space-y-1">
                            ${grupo.map(membro => `<li class="flex items-center gap-2"><div class="w-1.5 h-1.5 rounded-full bg-indigo-400"></div> ${membro}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }).join('');
        }

        // Funções para Abrir e Fechar Modal
        function abrirSorteador() {
            initSorteador();
            document.getElementById('modal-sorteador').classList.remove('hidden');
        }

        function fecharSorteador() {
            document.getElementById('modal-sorteador').classList.add('hidden');
        }
    </script>
</body>
</html>
